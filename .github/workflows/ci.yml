name: CI Pipeline — Test & Verify

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Lint, Build & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Build & Typecheck
        working-directory: ./backend
        run: npm run build

      - name: Run Backend E2E Tests (including E14, E12 race specs)
        working-directory: ./backend
        run: npm run test:e2e
        env:
          JWT_SECRET: test_jwt_secret_key_12345
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  admin-build:
    name: Admin Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Admin Next.js Production Build
        working-directory: ./admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.phanta.id.vn
