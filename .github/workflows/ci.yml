name: CI Pipeline — Test & Verify

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Lint, Build & E2E Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Build & Typecheck
        working-directory: ./backend
        run: npm run build

      - name: Seed Database
        working-directory: ./backend
        run: npm run seed
        env:
          JWT_SECRET: test_jwt_secret_key_12345
          MONGODB_URI: mongodb://localhost:27017/sports_booking
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Backend E2E Tests (including E14, E12 race specs)
        working-directory: ./backend
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee test-output.txt || {
            echo "## ❌ E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ All E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
        env:
          JWT_SECRET: test_jwt_secret_key_12345
          MONGODB_URI: mongodb://localhost:27017/sports_booking
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  admin-build:
    name: Admin Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Admin Next.js Production Build
        working-directory: ./admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.phanta.id.vn
