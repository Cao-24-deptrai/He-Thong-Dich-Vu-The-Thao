services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3000:3000"
  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: https://api.phanta.id.vn
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
volumes:
  redis_data:
